<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마을 친구 보이기 점검</title>
<style>
  html, body { margin: 0; height: 100%; background: #2f4a35; font-family: 'Malgun Gothic', system-ui, sans-serif; }
  .row { display: flex; gap: 6px; height: 100%; padding: 6px; box-sizing: border-box; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .col b { color: #fff; font-size: 13px; }
  iframe { flex: 1; border: 0; border-radius: 10px; width: 100%; }
</style>
</head>
<body>
<!-- 같은 마을에 두 학생이 들어온 상황: 왼쪽에서 움직이면 오른쪽 화면의 친구가 따라 움직여야 함 (서버 대신 가짜 저장소) -->
<div class="row">
  <div class="col"><b>가람 (시바견)</b><iframe id="a" src="village-test.html?sync=가람&pet=shiba"></iframe></div>
  <div class="col"><b>나래 (펫 없음 → 새싹)</b><iframe id="b" src="village-test.html?sync=나래"></iframe></div>
</div>
</body>
</html>
