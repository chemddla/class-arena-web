<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방 아바타(용병단장) 샘플</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 13px/1.4 system-ui, sans-serif; }
  h2 { margin: 12px 16px 4px; font-size: 15px; }
  p { margin: 0 16px 8px; color: #94a3b8; font-size: 12px; }
  .g { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; }
  .c { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; }
  canvas { width: 96px; height: 160px; image-rendering: pixelated; background: #cbd5e1; border-radius: 8px; }
</style>
</head>
<body>
<h2>🛡️ 방 안의 내 단장 — index.html의 RoomAvatar 엔진과 같은 코드</h2>
<p>48×80 도트. 부위별 모양을 찍고 명암·윤곽선은 자동. 저장 값은 stu.avatar (AV_FIELDS 참고). 아래는 부위별 보기와 랜덤 12명.</p>
<div class="g" id="g"></div>
<script>
    /********************************************************************
     * 12-C. 방 안의 내 아바타 (용병단장) — 48×80 도트, 부위마다 모양(마스크)을 찍고 명암·선을 자동으로 넣음
     * 저장: stu.avatar = { skin, eyeColor, hair, hairColor, armor, armorColor, legs, legsColor, shoeColor,
     *                      cape, capeColor, hat, hatColor, weapon, face, emblem }  (색은 견본 번호)
     ********************************************************************/
    const AV_SCALE = 1.5; // 방 안에서 그리는 배율 (48×80 → 72×120 도트, 의자 등받이보다 조금 큰 키)
    const AV_SKINS = ['#ffe3cc', '#f8cfa8', '#e9b083', '#cf9064', '#a4693f', '#6e432a'];
    const AV_HAIRS = ['#2e2633', '#5a3a28', '#9a6438', '#efc95e', '#eeeae2', '#d94c4c', '#ee86b0', '#8a5cc8', '#4677d0', '#4fb8b0'];
    const AV_EYES = ['#5a3a28', '#2e2633', '#3f6fc8', '#3f9a5a', '#8a5cc8', '#d98a2a', '#d94c4c'];
    const AV_CLOTH = ['#d94c4c', '#e8873a', '#e8c43a', '#8cc84b', '#3f9a5a', '#4fb8b0', '#5bb4e0', '#3f6fc8', '#2f3f86', '#8a5cc8', '#e87aa8', '#9a6438', '#6b4a2a', '#c9a27a', '#aeb6c2', '#3a3a40', '#5a1f28', '#f2f0f4'];
    const AV_PARTS = {
      hair:   [['short', '짧은 머리'], ['bob', '단발'], ['long', '긴 머리'], ['pony', '포니테일'], ['spiky', '삐죽 머리'], ['bald', '민머리']],
      armor:  [['tunic', '모험가 튜닉'], ['leather', '가죽 갑옷'], ['plate', '판금 갑옷'], ['coat', '단장 코트'], ['robe', '마법사 로브']],
      legs:   [['pants', '바지'], ['greaves', '철 정강이받이'], ['skirt', '전투 치마']],
      cape:   [['none', '없음'], ['short', '짧은 망토'], ['long', '긴 망토'], ['torn', '찢어진 망토']],
      hat:    [['none', '없음'], ['helm', '투구'], ['horn', '뿔 투구'], ['feather', '깃털 모자'], ['bandana', '두건'], ['hood', '후드'], ['crown', '왕관']],
      weapon: [['none', '맨손'], ['sword', '장검'], ['great', '대검'], ['bow', '활'], ['staff', '지팡이'], ['spear', '창'], ['shield', '검과 방패']],
      face:   [['none', '없음'], ['scar', '흉터'], ['patch', '안대'], ['beard', '수염'], ['mask', '마스크']],
    };
    // 고르는 항목: [저장 키, 이름, 종류('part' 모양 / 색 견본 목록)]
    const AV_FIELDS = [
      ['skin', '피부', AV_SKINS], ['eyeColor', '눈 색', AV_EYES], ['hair', '머리 모양', 'part'], ['hairColor', '머리 색', AV_HAIRS],
      ['face', '얼굴 장식', 'part'], ['armor', '갑옷·옷', 'part'], ['armorColor', '갑옷 색', AV_CLOTH], ['emblem', '단장 문장 색', AV_CLOTH],
      ['legs', '다리', 'part'], ['legsColor', '다리 색', AV_CLOTH], ['shoeColor', '부츠 색', AV_CLOTH],
      ['cape', '망토', 'part'], ['capeColor', '망토 색', AV_CLOTH], ['hat', '투구·모자', 'part'], ['hatColor', '모자 색', AV_CLOTH], ['weapon', '무기', 'part'],
    ];
    const AV_DEFAULT = { skin: 1, eyeColor: 0, hair: 'short', hairColor: 1, face: 'none', armor: 'leather', armorColor: 12, emblem: 2, legs: 'pants', legsColor: 15, shoeColor: 12, cape: 'short', capeColor: 0, hat: 'none', hatColor: 15, weapon: 'sword' };
    // 저장된 값을 안전한 생김새로 (없거나 깨진 값은 기본)
    function avatarLook(raw) {
      const a = { ...AV_DEFAULT };
      if (!raw || typeof raw !== 'object') return a;
      AV_FIELDS.forEach(([k, , list]) => {
        const v = raw[k];
        if (list === 'part') { if (AV_PARTS[k].some(([id]) => id === v)) a[k] = v; }
        else { const n = Math.floor(Number(v)); if (n >= 0 && n < list.length) a[k] = n; }
      });
      return a;
    }
    function avatarRandom() {
      const rnd = n => Math.random() * n | 0, a = {};
      AV_FIELDS.forEach(([k, , list]) => { a[k] = list === 'part' ? AV_PARTS[k][rnd(AV_PARTS[k].length)][0] : rnd(list.length); });
      return a;
    }
    const RoomAvatar = (() => {
      const W = 48, H = 80, FOOT = 75, SIT_FOOT = 63;
      const M = new Uint8Array(W * H);
      let buf, ink = 1;
      const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
      const hex = c => '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
      // 밝은 쪽은 살짝 따뜻하게, 그늘은 살짝 푸르게
      const ramp = h => { const c = rgb(h); return {
        lt: c.map((v, i) => Math.min(255, v * 1.08 + [22, 16, 6][i])), b: c,
        sh: [c[0] * 0.8, c[1] * 0.76, c[2] * 0.88], dp: [c[0] * 0.55, c[1] * 0.48, c[2] * 0.66] }; };
      const inM = (x, y) => x >= 0 && y >= 0 && x < W && y < H && M[y * W + x];
      const mSet = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < H) M[y * W + x] = ink; };
      const mRect = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) mSet(i, j); };
      const mEll = (cx, cy, rx, ry, y1 = -1e9, y2 = 1e9) => {
        for (let j = Math.floor(cy - ry); j <= cy + ry; j++) for (let i = Math.floor(cx - rx); i <= cx + rx; i++) {
          const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry;
          if (dx * dx + dy * dy <= 1 && j >= y1 && j <= y2) mSet(i, j);
        }
      };
      const mTri = (ax, ay, bx, by, cx, cy) => {
        const s = (px, py, x1, y1, x2, y2) => (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
        for (let j = Math.floor(Math.min(ay, by, cy)); j <= Math.max(ay, by, cy); j++)
          for (let i = Math.floor(Math.min(ax, bx, cx)); i <= Math.max(ax, bx, cx); i++) {
            const px = i + 0.5, py = j + 0.5, d1 = s(px, py, ax, ay, bx, by), d2 = s(px, py, bx, by, cx, cy), d3 = s(px, py, cx, cy, ax, ay);
            if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) mSet(i, j);
          }
      };
      // 굵은 선 (두 점 사이, 굵기 w)
      const mLine = (x0, y0, x1, y1, w) => {
        const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1, r = w / 2;
        for (let j = Math.floor(Math.min(y0, y1) - r); j <= Math.max(y0, y1) + r; j++) for (let i = Math.floor(Math.min(x0, x1) - r); i <= Math.max(x0, x1) + r; i++) {
          const px = i + 0.5, py = j + 0.5, t = Math.max(0, Math.min(1, ((px - x0) * dx + (py - y0) * dy) / L2));
          const qx = x0 + t * dx, qy = y0 + t * dy;
          if ((px - qx) ** 2 + (py - qy) ** 2 <= r * r) mSet(i, j);
        }
      };
      // 휜 선 (가운데 점 C 쪽으로 휨)
      const mCurve = (ax, ay, cx, cy, bx, by, w) => {
        let px = ax, py = ay;
        for (let k = 1; k <= 10; k++) {
          const t = k / 10, x = (1 - t) ** 2 * ax + 2 * (1 - t) * t * cx + t * t * bx, y = (1 - t) ** 2 * ay + 2 * (1 - t) * t * cy + t * t * by;
          mLine(px, py, x, y, w); px = x; py = y;
        }
      };
      const put = (x, y, c) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const i = (y * W + x) * 4; buf[i] = c[0]; buf[i + 1] = c[1]; buf[i + 2] = c[2]; buf[i + 3] = 255; };
      const dot = (x, y, c) => put(x, y, typeof c === 'string' ? rgb(c) : c);
      // 찍은 모양을 색칠: 왼쪽 위 1줄 밝게, 오른쪽·아래 sh줄 그늘. line: 'all' 테두리, 'b' 아래쪽만 진한 선
      function commit(h, { flat = false, line = '', sh = 2 } = {}) {
        const r = ramp(h);
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          if (!M[y * W + x]) continue;
          let c = r.b;
          if (!flat) {
            if (!inM(x - 1, y) || !inM(x, y - 1)) c = r.lt;
            for (let k = 0; k < sh; k++) if (!inM(x + k + 1, y) || !inM(x, y + k + 1)) { c = r.sh; break; }
          }
          if (line === 'all' && (!inM(x - 1, y) || !inM(x + 1, y) || !inM(x, y - 1) || !inM(x, y + 1))) c = r.dp;
          if (line === 'b' && !inM(x, y + 1)) c = r.dp;
          put(x, y, c);
        }
        M.fill(0);
      }
      const METAL = '#aeb6c2', GOLD = '#e8c43a', DARK = '#3a3a40', LEATH = '#6b4a2a', WOOD = '#8a5a30', WHITE = '#f2f0f4';

      // a: 생김새, back: 뒷모습, f: 걷기 칸 0~3, sit: 앉은 자세
      function paint(a, back, f, sit) {
        buf = new Uint8ClampedArray(W * H * 4); M.fill(0); ink = 1;
        const sk = AV_SKINS[a.skin], hc = AV_HAIRS[a.hairColor], ac = AV_CLOTH[a.armorColor], lc = AV_CLOTH[a.legsColor];
        const cc = AV_CLOTH[a.capeColor], hatC = AV_CLOTH[a.hatColor], shoe = AV_CLOTH[a.shoeColor], em = AV_CLOTH[a.emblem];
        const rH = ramp(hc), rA = ramp(ac), rS = ramp(sk), rC = ramp(cc);
        const o = sit ? 0 : -(f % 2);                       // 걸을 때 위로 1도트 들썩
        const lift = sit ? '' : f === 1 ? 'L' : f === 3 ? 'R' : ''; // 드는 다리
        const robe = a.armor === 'robe', coat = a.armor === 'coat', plate = a.armor === 'plate';
        const X = x => back ? W - 1 - x : x;               // 뒷모습은 오른손이 화면 왼쪽
        const hooded = a.hat === 'hood', helmet = a.hat === 'helm' || a.hat === 'horn';

        // ── 등에 멘 무기 (앞모습은 몸 뒤, 뒷모습은 맨 나중에)
        const backGear = () => {
          if (a.weapon === 'great') {
            mLine(X(31), 26 + o, X(8), 64 + o, 4); mTri(X(8), 64 + o, X(10.5), 60 + o, X(4), 69 + o); commit(METAL, { sh: 1, line: 'b' });
            for (let k = 0; k < 9; k++) put(X(28 - k * 2), 30 + k * 3 + o, [230, 234, 240]);
            mLine(X(26), 22 + o, X(36), 30 + o, 2.4); commit(GOLD, { flat: true });
            mLine(X(31), 26 + o, X(36), 18 + o, 3); commit(LEATH, { sh: 1 });
            mEll(X(37), 16.5 + o, 2, 2); commit(GOLD, { sh: 1 });
          }
          if (a.weapon === 'bow') {
            mLine(X(34), 18 + o, X(12), 64 + o, 1); commit(WHITE, { flat: true });
            mCurve(X(34), 18 + o, X(12), 34 + o, X(12), 64 + o, 3); commit(WOOD, { sh: 1, line: 'b' });
            mRect(X(21) - 1, 39 + o, 3, 5); commit(LEATH, { flat: true });
          }
        };
        // ── 망토 (앞모습은 몸 뒤, 뒷모습은 몸 위)
        const capeBot = a.cape === 'short' ? 58 : a.cape === 'long' ? 72 : 69;
        const cape = () => {
          if (a.cape === 'none') return;
          mTri(14, 38 + o, 34, 38 + o, 9, capeBot + o); mTri(34, 38 + o, 39, capeBot + o, 9, capeBot + o);
          if (a.cape === 'torn') { ink = 0; [12, 19, 26, 33].forEach(x => mTri(x, capeBot + 1 + o, x + 4, capeBot + 1 + o, x + 2, capeBot - 4 + o)); ink = 1; }
          commit(cc, { line: 'b' });
          [18, 24, 30].forEach(x => { for (let y = 44; y < capeBot - 2; y++) put(x + Math.round((x - 24) * (y - 38) / 60), y + o, rC.sh); });
          if (back) { // 등의 단장 문장
            const cy = Math.min(50, capeBot - 8) + o;
            mTri(24, cy - 5, 29, cy, 19, cy); mTri(19, cy, 29, cy, 24, cy + 5); commit(em, { flat: true, line: 'all' });
          }
        };
        if (!back) { backGear(); cape(); }
        if (!back && a.hair === 'long' && !hooded) { mRect(9, 22 + o, 30, 32); mEll(24, 54 + o, 15, 4); commit(hex(rH.sh)); }
        if (a.hair === 'pony') { // 뒤로 묶은 꼬리 (앞모습은 머리 뒤 오른쪽, 뒷모습은 가운데)
          const px = back ? 24 : 38;
          mEll(px, 36 + o, 4, 11); commit(hc, { line: 'b' }); mEll(px, 27 + o, 3, 1.6); commit(em, { flat: true });
        }

        // ── 다리·부츠
        const leg = (x, side) => {
          const up = lift === side ? 2 : 0, bot = (sit ? SIT_FOOT : FOOT) - 4 - up;
          mRect(x, 54, 6, bot - 54); commit(sk);
          if (!robe) {
            if (a.legs === 'pants') { mRect(x, 54, 6, bot - 54); commit(lc); }
            else if (a.legs === 'greaves') { mRect(x, 54, 6, 5); commit(lc); mRect(x - 1, 58, 8, bot - 58); commit(METAL, { line: 'all', sh: 1 }); dot(x + 1, 60, GOLD); dot(x + 4, 60, GOLD); }
            else { mRect(x, 54, 6, 5); commit(lc); }
          }
          const bh = a.legs === 'greaves' || sit ? 4 : 7;
          mRect(x - 1, bot + 4 - bh, 8, bh); ink = 0; mSet(x - 1, bot + 4 - bh); mSet(x + 6, bot + 4 - bh); ink = 1; commit(shoe, { line: 'b' });
          for (let i = 0; i < 8; i++) dot(x - 1 + i, bot + 4, [60, 44, 36]);
          if (bh === 7) for (let i = 0; i < 6; i++) put(x + i, bot - 1, ramp(shoe).dp); // 부츠 접힌 선
        };
        leg(17, 'L'); leg(25, 'R');

        // ── 엉덩이·치마
        if (!robe && a.legs === 'skirt') {
          mTri(16, 49 + o, 32, 49 + o, 36, 63 + o); mTri(16, 49 + o, 36, 63 + o, 12, 63 + o); commit(lc, { line: 'b' });
          [16, 20, 24, 28, 32].forEach(x => { for (let y = 52; y < 62; y++) put(x + Math.round((x - 24) * (y - 50) / 24), y + o, ramp(lc).dp); });
          mRect(15, 49 + o, 18, 2); commit(METAL, { flat: true, line: 'b' });
        } else if (!robe) { mRect(16, 50 + o, 16, 7); commit(coat ? ac : lc); }

        // ── 몸통 (갑옷 종류별)
        if (robe) {
          mRect(16, 40 + o, 16, 12); mRect(17, 38 + o, 14, 2);
          const rb = sit ? SIT_FOOT : FOOT - 1;
          mRect(15, 50 + o, 18, rb - 50 - o); mTri(15, 56 + o, 15, rb, 10, rb); mTri(33, 56 + o, 33, rb, 38, rb);
          commit(ac, { line: 'b' });
          for (let x = 11; x < 37; x++) put(x, rb - 3, rA.dp);
          [17, 31].forEach(x => { for (let y = 54; y < rb - 3; y++) put(x + Math.round((x - 24) * (y - 50) / 30), y + o, rA.sh); });
          mRect(15, 50 + o, 18, 3); commit(GOLD, { flat: true, line: 'b' });
        } else {
          mRect(16, 40 + o, 16, 12); mRect(17, 38 + o, 14, 2); commit(plate ? ac : ac);
          if (coat) { // 긴 코트 자락 (다리 위로)
            const cb = sit ? SIT_FOOT - 2 : 67;
            mRect(14, 50 + o, 20, cb - 50); ink = 0; mRect(23, 55 + o, 2, cb - 55); ink = 1; commit(ac, { line: 'b' });
          }
        }
        if (!back) {
          if (a.armor === 'tunic') {
            mEll(24, 38 + o, 3.5, 2.4); commit(sk, { flat: true });
            [[23, 41], [25, 41], [23, 43], [25, 43]].forEach(([x, y]) => dot(x, y + o, rA.dp));
            for (let y = 40; y < 45; y++) put(24, y + o, rA.sh);
          }
          if (a.armor === 'leather') {
            mLine(17, 40 + o, 31, 51 + o, 2.2); commit('#4a3220', { flat: true });
            [[19, 42], [23, 45], [27, 48]].forEach(([x, y]) => dot(x, y + o, GOLD));
            mEll(16.5, 40 + o, 4.5, 2.8); mEll(31.5, 40 + o, 4.5, 2.8); commit('#4a3220', { line: 'b' });
          }
          if (plate) {
            for (let y = 41; y < 50; y++) put(24, y + o, rA.dp);
            for (let x = 18; x < 31; x++) put(x, 46 + o, rA.dp);
            mEll(14.5, 40 + o, 5.5, 3.4); mEll(33.5, 40 + o, 5.5, 3.4); commit(ac, { line: 'all', sh: 1 });
            mRect(20, 37 + o, 8, 2); commit(hex(rA.sh), { flat: true, line: 'b' });
            mTri(24, 43 + o, 27, 46 + o, 21, 46 + o); mTri(21, 46 + o, 27, 46 + o, 24, 49 + o); commit(em, { flat: true });
          }
          if (coat) {
            mTri(17, 38 + o, 24, 38 + o, 20, 46 + o); mTri(31, 38 + o, 24, 38 + o, 28, 46 + o); commit(hex(rA.dp), { flat: true });
            for (let y = 44; y < 66; y++) { put(22, y + o, [232, 196, 58]); put(25, y + o, [232, 196, 58]); }
            [[23, 48], [23, 53], [23, 58]].forEach(([x, y]) => dot(x, y + o, GOLD));
            mRect(13, 38 + o, 6, 2); mRect(29, 38 + o, 6, 2); commit(GOLD, { flat: true, line: 'b' });
            mTri(29, 42 + o, 32, 45 + o, 26, 45 + o); mTri(26, 45 + o, 32, 45 + o, 29, 48 + o); commit(em, { flat: true });
          }
          if (robe) {
            mTri(24, 42 + o, 28, 46 + o, 20, 46 + o); mTri(20, 46 + o, 28, 46 + o, 24, 50 + o); commit(em, { flat: true });
            mEll(24, 38 + o, 3, 2); commit(sk, { flat: true });
          }
          if (!robe) { // 허리띠·버클
            mRect(16, 50 + o, 16, 2); commit(LEATH, { flat: true, line: 'b' });
            dot(23, 50 + o, GOLD); dot(24, 50 + o, GOLD); dot(23, 51 + o, GOLD); dot(24, 51 + o, GOLD);
          }
        } else {
          if (plate) { mEll(14.5, 40 + o, 5.5, 3.4); mEll(33.5, 40 + o, 5.5, 3.4); commit(ac, { line: 'all', sh: 1 }); }
          if (a.armor === 'leather') { mEll(16.5, 40 + o, 4.5, 2.8); mEll(31.5, 40 + o, 4.5, 2.8); commit('#4a3220', { line: 'b' }); }
          if (coat) { mRect(13, 38 + o, 6, 2); mRect(29, 38 + o, 6, 2); commit(GOLD, { flat: true, line: 'b' }); for (let y = 52; y < 66; y++) put(24, y + o, rA.dp); }
          if (!robe) { mRect(16, 50 + o, 16, 2); commit(LEATH, { flat: true, line: 'b' }); }
        }

        // ── 팔 (드는 다리 반대쪽 팔이 앞으로)
        const arm = (x, side) => {
          const sw = !lift ? 0 : lift === side ? 1 : -1, y = 39 + o + sw;
          const sleeve = { tunic: 5, leather: 4, plate: 12, coat: 13, robe: 13 }[a.armor];
