<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방 아바타 샘플</title>
<style>
  body { margin: 0; background: #0f172a; color: #e2e8f0; font: 13px/1.4 system-ui, sans-serif; }
  .wrap { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .stage { background: linear-gradient(180deg,#ead6fb 0%,#f6d5ec 100%); border-radius: 16px; padding: 8px; position: relative; }
  #room { display: block; width: 720px; max-width: 100%; image-rendering: pixelated; }
  .panel { width: 320px; background: #020617; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row b { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .opts button { background: #1e293b; color: #e2e8f0; border: 2px solid transparent; border-radius: 8px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
  .opts button.sw { width: 24px; height: 24px; padding: 0; }
  .opts button.on { border-color: #fbbf24; }
  .pv { display: flex; gap: 8px; justify-content: center; }
  .pv canvas { width: 144px; height: 240px; image-rendering: pixelated; background: #1e293b; border-radius: 10px; }
  .pad { position: absolute; right: 16px; bottom: 16px; display: grid; grid-template-columns: repeat(3, 40px); gap: 4px; }
  .pad button { height: 40px; border-radius: 10px; border: 0; background: #0f172acc; color: #fff; font-size: 18px; touch-action: none; }
  .gallery { width: 100%; display: flex; gap: 8px; flex-wrap: wrap; }
  .gallery canvas { width: 96px; height: 160px; image-rendering: pixelated; background: #1e293b; border-radius: 8px; }
  code { font-size: 11px; color: #a5b4fc; word-break: break-all; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="room" width="960" height="856"></canvas>
    <div class="pad">
      <span></span><button data-k="ArrowUp">↑</button><span></span>
      <button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button>
    </div>
  </div>
  <div class="panel">
    <div class="pv"><canvas id="pvFront" width="48" height="80"></canvas><canvas id="pvBack" width="48" height="80"></canvas></div>
    <div id="opts"></div>
    <button id="rand" style="padding:8px;border-radius:8px;border:0;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer">🎲 랜덤</button>
    <div><b style="color:#94a3b8;font-size:12px">저장되는 값 (stu.avatar)</b><br><code id="json"></code></div>
  </div>
  <div class="gallery" id="gallery"></div>
</div>
<script>
// ───── 아바타: 48×80 도트. 부위마다 모양(마스크)을 찍고 명암·선을 자동으로 넣음 ─────
const SKINS = ['#ffe3cc', '#f8cfa8', '#e9b083', '#cf9064', '#a4693f', '#6e432a'];
const HAIRS = ['#2e2633', '#5a3a28', '#9a6438', '#efc95e', '#eeeae2', '#d94c4c', '#ee86b0', '#8a5cc8', '#4677d0', '#4fb8b0'];
const EYES = ['#5a3a28', '#2e2633', '#3f6fc8', '#3f9a5a', '#8a5cc8', '#d98a2a'];
const CLOTH = ['#d94c4c', '#e8873a', '#e8c43a', '#8cc84b', '#3f9a5a', '#4fb8b0', '#5bb4e0', '#3f6fc8', '#2f3f86', '#8a5cc8', '#e87aa8', '#9a6438', '#c9a27a', '#3a3a40', '#f2f0f4'];
const PARTS = {
  hair:   [['short', '짧은 머리'], ['bob', '단발'], ['long', '긴 머리'], ['twin', '양갈래'], ['spiky', '삐죽 머리']],
  top:    [['tee', '반팔'], ['hoodie', '후드티'], ['uniform', '교복'], ['dress', '원피스']],
  bottom: [['pants', '긴바지'], ['shorts', '반바지'], ['skirt', '치마']],
  hat:    [['none', '없음'], ['cap', '야구모자'], ['beanie', '비니'], ['ribbon', '리본'], ['cat', '고양이 귀']],
};
const W = 48, H = 80, FOOT = 75; // 발바닥 y
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
// 밝은 쪽은 살짝 따뜻하게, 그늘은 살짝 푸르게
const ramp = h => { const c = rgb(h); return {
  lt: c.map((v, i) => Math.min(255, v * 1.08 + [22, 16, 6][i])), b: c,
  sh: [c[0] * 0.8, c[1] * 0.76, c[2] * 0.88], dp: [c[0] * 0.55, c[1] * 0.48, c[2] * 0.66] }; };

const M = new Uint8Array(W * H);
let buf;
let ink = 1;
const inM = (x, y) => x >= 0 && y >= 0 && x < W && y < H && M[y * W + x];
const mSet = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < H) M[y * W + x] = ink; };
const mRect = (x, y, w, h) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) mSet(i, j); };
const mEll = (cx, cy, rx, ry, y1 = -1e9, y2 = 1e9) => {
  for (let j = Math.floor(cy - ry); j <= cy + ry; j++) for (let i = Math.floor(cx - rx); i <= cx + rx; i++) {
    const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry;
    if (dx * dx + dy * dy <= 1 && j >= y1 && j <= y2) mSet(i, j);
  }
};
const mTri = (ax, ay, bx, by, cx, cy) => {
  const s = (px, py, x1, y1, x2, y2) => (px - x2) * (y1 - y2) - (x1 - x2) * (py - y2);
  for (let j = Math.floor(Math.min(ay, by, cy)); j <= Math.max(ay, by, cy); j++)
    for (let i = Math.floor(Math.min(ax, bx, cx)); i <= Math.max(ax, bx, cx); i++) {
      const px = i + 0.5, py = j + 0.5, d1 = s(px, py, ax, ay, bx, by), d2 = s(px, py, bx, by, cx, cy), d3 = s(px, py, cx, cy, ax, ay);
      if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) mSet(i, j);
    }
};
const put = (x, y, c) => { if (x < 0 || y < 0 || x >= W || y >= H) return; const i = (y * W + x) * 4; buf[i] = c[0]; buf[i + 1] = c[1]; buf[i + 2] = c[2]; buf[i + 3] = 255; };
const dot = (x, y, hex) => put(x, y, typeof hex === 'string' ? rgb(hex) : hex);
// 찍은 모양을 색칠: 왼쪽 위 1줄 밝게, 오른쪽·아래 2줄 그늘. line: 'all' 테두리, 'b' 아래쪽만 진한 선
function commit(hex, { flat = false, line = '', sh = 2 } = {}) {
  const r = ramp(hex);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!M[y * W + x]) continue;
    let c = r.b;
    if (!flat) {
      if (!inM(x - 1, y) || !inM(x, y - 1)) c = r.lt;
      if ([...Array(sh)].some((_, k) => !inM(x + k + 1, y) || !inM(x, y + k + 1))) c = r.sh;
    }
    if (line === 'all' && (!inM(x - 1, y) || !inM(x + 1, y) || !inM(x, y - 1) || !inM(x, y + 1))) c = r.dp;
    if (line === 'b' && !inM(x, y + 1)) c = r.dp;
    put(x, y, c);
  }
  M.fill(0);
}

// a: 생김새, back: 뒷모습, f: 걷기 칸 0~3
function drawAvatar(g, a, back = false, f = 0) {
  buf = new Uint8ClampedArray(W * H * 4);
  const sk = SKINS[a.skin], hc = HAIRS[a.hairColor], tc = CLOTH[a.topColor], bc = CLOTH[a.bottomColor];
  const hatC = CLOTH[a.hatColor], shoe = CLOTH[a.shoeColor];
  const rH = ramp(hc), rT = ramp(tc), rS = ramp(sk);
  const o = -(f % 2);                                // 걸을 때 위로 1도트 들썩
  const lift = f === 1 ? 'L' : f === 3 ? 'R' : '';   // 드는 다리
  const dress = a.top === 'dress';

  // ── 뒤에 늘어지는 머리 (앞모습일 때만 몸 뒤)
  if (!back && a.hair === 'long') { mRect(9, 22 + o, 30, 32); mEll(24, 54 + o, 15, 4); commit(rgb2hex(rH.sh)); }
  const twinTails = () => {
    mEll(6, 42 + o, 4.5, 12); mEll(42, 42 + o, 4.5, 12); commit(hc);
    [6, 42].forEach(x => { mEll(x, 30 + o, 3, 1.6); commit(CLOTH[a.hatColor], { flat: true }); });
  };
  if (a.hair === 'twin') twinTails();
  if (!back && a.top === 'hoodie') { mEll(24, 38 + o, 13, 5); commit(rgb2hex(rT.sh), { flat: true }); }

  // ── 다리·신발
  const leg = (x, side) => {
    const up = lift === side ? 2 : 0, bot = FOOT - 4 - up;
    mRect(x, 54, 6, bot - 54); commit(sk);
    const pants = !dress && a.bottom === 'pants' ? bot - 54 : !dress && a.bottom === 'shorts' ? 8 : 0;
    if (pants) { mRect(x, 54, 6, pants); commit(bc, { line: a.bottom === 'shorts' ? 'b' : '' }); }
    mRect(x - 1, bot, 8, 4); ink = 0; mSet(x - 1, bot); mSet(x + 6, bot); ink = 1; commit(shoe);
    for (let i = 0; i < 8; i++) dot(x - 1 + i, bot + 4, '#ece6ee');
  };
  leg(17, 'L'); leg(25, 'R');

  // ── 엉덩이·치마
  if (dress || a.bottom === 'skirt') {
    mTri(16, 49 + o, 32, 49 + o, 36, 63 + o); mTri(16, 49 + o, 36, 63 + o, 12, 63 + o); commit(dress ? tc : bc, { line: 'b' });
    const pl = ramp(dress ? tc : bc).sh;
    [18, 24, 30].forEach(x => { for (let y = 55; y < 62; y++) put(x + Math.round((x - 24) * (y - 52) / 22), y + o, pl); });
  } else { mRect(16, 50 + o, 16, 7); commit(bc); }

  // ── 몸통
  mRect(16, 40 + o, 16, 12); mRect(17, 38 + o, 14, 2); commit(tc);
  if (!back) {
    if (a.top === 'tee') {
      mEll(24, 38 + o, 3.5, 2.2); commit(sk, { flat: true });
      [[23, 44], [25, 44], [22, 45], [23, 45], [24, 45], [25, 45], [26, 45], [23, 46], [24, 46], [25, 46], [24, 47]].forEach(([x, y]) => dot(x, y + o, '#fbf5ea'));
    }
    if (a.top === 'hoodie') {
      for (let y = 40; y < 45; y++) { dot(21, y + o, '#f4f0f6'); dot(27, y + o, '#f4f0f6'); }
      mRect(18, 46 + o, 12, 5); commit(rgb2hex(rT.sh), { flat: true });
      for (let x = 18; x < 30; x++) put(x, 46 + o, rT.dp);
    }
    if (a.top === 'uniform') {
      mTri(19, 38 + o, 29, 38 + o, 24, 47 + o); commit('#f4f0f6', { flat: true });
      mRect(23, 39 + o, 2, 1); mTri(22.5, 40 + o, 25.5, 40 + o, 24, 49 + o); commit('#d94c4c');
      for (let y = 46; y < 52; y++) { put(21, y + o, rT.dp); put(26, y + o, rT.dp); }
      dot(19, 49 + o, '#efc95e'); dot(28, 49 + o, '#efc95e');
    }
    if (dress) {
      mEll(20.5, 39 + o, 3.2, 2); mEll(27.5, 39 + o, 3.2, 2); commit('#f4f0f6', { flat: true });
      mRect(16, 49 + o, 16, 2); commit(rgb2hex(rT.sh), { flat: true });
      mTri(24, 50 + o, 20, 47 + o, 20, 53 + o); mTri(24, 50 + o, 28, 47 + o, 28, 53 + o); commit('#f4f0f6');
    }
  } else if (a.top === 'hoodie') { mEll(24, 41 + o, 9, 5, 38 + o); commit(rgb2hex(rT.sh), { line: 'b' }); }

  // ── 팔 (드는 다리 반대쪽 팔이 앞으로)
  const arm = (x, side) => {
    const sw = !lift ? 0 : lift === side ? 1 : -1, y = 39 + o + sw;
    const sleeve = a.top === 'tee' ? 5 : dress ? 4 : 12;
    mRect(x, y, 4, 13); commit(sk, { line: 'all', sh: 1 });
    mEll(x + 2, y + 14, 2.6, 2.4); commit(sk, { sh: 1 });
    mRect(x - (side === 'L' ? 1 : 0), y - 1, 5, sleeve); commit(tc, { line: 'all', sh: 1 });
  };
  arm(12, 'L'); arm(32, 'R');

  // ── 목·귀·얼굴
  mRect(21, 34 + o, 6, 5); commit(rgb2hex(rS.sh), { flat: true });
  mEll(8.5, 26 + o, 2.6, 3.2); mEll(39.5, 26 + o, 2.6, 3.2); commit(sk);
  mEll(24, 23 + o, 15.5, 14.5); mEll(24, 28 + o, 13, 9.5); commit(sk, { sh: 3 });
  if (!back) {
    const iris = ramp(EYES[a.eyeColor]);
    [15, 29].forEach((ex, k) => {
      for (let y = 24; y < 30; y++) for (let x = ex; x < ex + 4; x++) {
        if (y === 24 && (x === ex || x === ex + 3)) continue;
        put(x, y + o, y >= 27 ? (y === 29 ? iris.lt : iris.b) : [46, 38, 51]);
      }
      put(k ? ex + 4 : ex - 1, 24 + o, [46, 38, 51]);        // 바깥 속눈썹
      dot(ex, 25 + o, '#ffffff'); dot(ex + 1, 25 + o, '#ffffff'); dot(ex, 26 + o, '#ffffff');
      dot(ex + 3, 28 + o, '#ffffff');
    });
    mEll(14, 31.5 + o, 2.6, 1.3); mEll(34, 31.5 + o, 2.6, 1.3); commit('#f6a0a6', { flat: true });
    put(24, 30 + o, rS.sh);
    [[22, 32], [23, 33], [24, 33], [25, 32]].forEach(([x, y]) => dot(x, y + o, '#a5464f'));
  }

  // ── 머리카락
  const side = { short: [4, 12], bob: [6, 20], long: [5, 30], twin: [4, 12], spiky: [4, 10] }[a.hair];
  if (back) {
    mEll(24, 22 + o, 16.5, 15.5); mRect(8, 22 + o, 32, 12);
    if (a.hair === 'long') { mRect(9, 22 + o, 30, 32); mEll(24, 54 + o, 15, 4); }
    if (a.hair === 'bob') { mRect(6, 18 + o, 36, 20); }
  } else {
    mEll(24, 20 + o, 17, 14, 0, 21 + o);
    mRect(12 - side[0], 18 + o, side[0], side[1]); mRect(36, 18 + o, side[0], side[1]);
    [[8, 15, 10, 31], [13, 21, 17, 25], [19, 27, 23, 24], [25, 32, 29, 25], [30, 38, 34, 24], [34, 41, 38, 31]]
      .forEach(([x0, x1, tx, ty]) => mTri(x0, 20 + o, x1, 20 + o, tx, ty + o));
  }
  if (a.hair === 'spiky' && a.hat !== 'cap' && a.hat !== 'beanie') { mTri(10, 13 + o, 17, 9 + o, 7, 2 + o); mTri(17, 9 + o, 25, 8 + o, 19, 0 + o); mTri(24, 8 + o, 31, 9 + o, 31, 1 + o); mTri(31, 9 + o, 38, 13 + o, 41, 4 + o); }
  commit(hc, { line: back ? '' : 'b' });
  for (let x = 13; x <= 31; x++) { const y = 12 + Math.round(((x - 22) / 9) ** 2 * 3); if (inHair(x, y + o)) put(x, y + o, rH.lt); }
  (back ? [[16, 24, 33], [24, 25, 34], [32, 24, 33]] : [[18, 14, 19], [30, 14, 18]])
    .forEach(([x, y1, y2]) => { for (let y = y1; y < y2; y++) put(x, y + o, rH.sh); });

  // ── 모자·장식
  if (a.hat === 'cap') {
    mEll(24, 16 + o, 16.5, 11, 0, 18 + o); commit(hatC);
    dot(24, 5 + o, rgb2hex(ramp(hatC).dp));
    if (!back) { mEll(24, 19 + o, 17, 3.2, 18 + o); commit(rgb2hex(ramp(hatC).sh), { flat: true, line: 'b' }); dot(24, 11 + o, '#f4f0f6'); dot(23, 12 + o, '#f4f0f6'); dot(25, 12 + o, '#f4f0f6'); }
    else { mRect(20, 16 + o, 8, 2); commit(rgb2hex(ramp(hatC).sh), { flat: true }); }
  }
  if (a.hat === 'beanie') {
    const rb = ramp(hatC);
    mEll(24, 17 + o, 17, 13, 0, 18 + o); commit(hatC);
    mRect(7, 15 + o, 34, 5); commit(rgb2hex(rb.sh), { line: 'b' });
    for (let x = 9; x < 40; x += 3) for (let y = 15; y < 19; y++) put(x, y + o, rb.dp);
    mEll(24, 4.5 + o, 4, 3.6); commit('#f4f0f6');
  }
  if (a.hat === 'ribbon') {
    mTri(33, 9 + o, 26, 4 + o, 26, 14 + o); mTri(33, 9 + o, 40, 4 + o, 40, 14 + o); commit(hatC);
    mEll(33, 9 + o, 2, 2); commit(rgb2hex(ramp(hatC).sh), { flat: true });
  }
  if (a.hat === 'cat') {
    mTri(7, 16 + o, 18, 9 + o, 9, 0 + o); mTri(41, 16 + o, 30, 9 + o, 39, 0 + o); commit(hc);
    if (!back) { mTri(10, 12 + o, 16, 9 + o, 10, 4 + o); mTri(38, 12 + o, 32, 9 + o, 38, 4 + o); commit('#f6a0a6', { flat: true }); }
  }
  if (back && a.hair === 'twin') twinTails(); // 뒷모습은 양갈래가 머리 위에 겹침

  // ── 바깥 윤곽선: 이웃 색을 진하게
  const src = buf.slice();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (src[i + 3]) continue;
    for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const j = (ny * W + nx) * 4;
      if (!src[j + 3]) continue;
      put(x, y, [src[j] * 0.32, src[j + 1] * 0.26, src[j + 2] * 0.38]);
      break;
    }
  }
  g.putImageData(new ImageData(buf, W, H), 0, 0);
}
function rgb2hex(c) { return '#' + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join(''); }
// 앞머리 윤기선은 머리카락 위에만 (머리 색 그대로인 칸)
function inHair(x, y) { const i = (y * W + x) * 4; return buf[i + 3] && y < 21; }

// ───── 설정 UI ─────
const look = { skin: 1, eyeColor: 0, hair: 'short', hairColor: 1, top: 'hoodie', topColor: 6, bottom: 'pants', bottomColor: 8, shoeColor: 14, hat: 'none', hatColor: 0 };
const opts = document.getElementById('opts');
function ui() {
  const sw = (key, list, label) => `<div class="row"><b>${label}</b><div class="opts">${list.map((c, i) => `<button class="sw ${look[key] === i ? 'on' : ''}" style="background:${c}" onclick="set('${key}',${i})"></button>`).join('')}</div></div>`;
  const pick = (key, label) => `<div class="row"><b>${label}</b><div class="opts">${PARTS[key].map(([id, n]) => `<button class="${look[key] === id ? 'on' : ''}" onclick="set('${key}','${id}')">${n}</button>`).join('')}</div></div>`;
  opts.innerHTML = sw('skin', SKINS, '피부') + sw('eyeColor', EYES, '눈 색') + pick('hair', '머리 모양') + sw('hairColor', HAIRS, '머리 색')
    + pick('top', '윗옷') + sw('topColor', CLOTH, '윗옷 색') + pick('bottom', '아래옷') + sw('bottomColor', CLOTH, '아래옷 색')
    + sw('shoeColor', CLOTH, '신발 색') + pick('hat', '모자·장식') + (look.hat === 'none' || look.hat === 'cat' ? '' : sw('hatColor', CLOTH, '모자 색'));
  document.getElementById('json').textContent = JSON.stringify(look);
}
window.set = (k, v) => { look[k] = v; ui(); };
const rnd = n => Math.random() * n | 0;
const randLook = () => ({
  skin: rnd(SKINS.length), eyeColor: rnd(EYES.length), hairColor: rnd(HAIRS.length),
  topColor: rnd(CLOTH.length), bottomColor: rnd(CLOTH.length), shoeColor: rnd(CLOTH.length), hatColor: rnd(CLOTH.length),
  ...Object.fromEntries(Object.entries(PARTS).map(([k, l]) => [k, l[rnd(l.length)][0]])),
});
document.getElementById('rand').onclick = () => { Object.assign(look, randLook()); ui(); };
ui();

// 여러 명 예시
const gal = document.getElementById('gallery');
for (let i = 0; i < 12; i++) { const c = document.createElement('canvas'); c.width = W; c.height = H; drawAvatar(c.getContext('2d'), randLook(), i % 4 === 3); gal.appendChild(c); }

// ───── 방 (index.html 방 꾸미기와 같은 좌표: 칸 128×64, 8×6) ─────
const CW = 64, CH = 32, OX = 32 + 6 * CW, OY = 32 + 4 * 80 + 8, RX = 8, RY = 6, SCALE = 1.5;
const iso = (X, Y) => ({ x: OX + (X - Y) * CW, y: OY + (X + Y) * CH });
const room = document.getElementById('room'), ctx = room.getContext('2d');
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
const sprite = document.createElement('canvas'); sprite.width = W; sprite.height = H;
const sg = sprite.getContext('2d');
const pvF = document.getElementById('pvFront').getContext('2d'), pvB = document.getElementById('pvBack').getContext('2d');

const me = { X: 4, Y: 3, back: false, flip: false, t: 0 };
const keys = new Set();
addEventListener('keydown', e => { if (e.key.startsWith('Arrow')) { keys.add(e.key); e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.key));
document.querySelectorAll('.pad button').forEach(b => {
  b.onpointerdown = () => keys.add(b.dataset.k);
  b.onpointerup = b.onpointerleave = () => keys.delete(b.dataset.k);
});

Promise.all([load('../assets/room/wall_cream.webp'), load('../assets/room/floor_wood.webp')]).then(([wall, floor]) => {
  let last = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    // 화면 방향 → 바닥 칸: 위 = X−,Y− / 오른쪽 = X+,Y−
    const sx = (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0);
    const sy = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);
    const moving = sx || sy;
    if (moving) {
      let dX = sx + sy, dY = sy - sx; const n = Math.hypot(dX, dY) || 1;
      me.X = Math.max(0.4, Math.min(RX - 0.4, me.X + dX / n * 2.2 * dt));
      me.Y = Math.max(0.4, Math.min(RY - 0.4, me.Y + dY / n * 2.2 * dt));
      if (sy) me.back = sy < 0;
      if (sx) me.flip = sx < 0;
      me.t += dt;
    } else me.t = 0;
    const f = moving ? (me.t * 8 | 0) % 4 : 0;

    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, room.width, room.height);
    if (wall) ctx.drawImage(wall, 0, 0);
    if (floor) ctx.drawImage(floor, 0, 0);
    drawAvatar(sg, look, me.back, f);
    const p = iso(me.X, me.Y), top = p.y - FOOT * SCALE;
    ctx.fillStyle = 'rgba(40,20,40,.25)';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(Math.round(p.x), Math.round(top));
    if (me.flip) ctx.scale(-1, 1);
    ctx.drawImage(sprite, -W / 2 * SCALE, 0, W * SCALE, H * SCALE);
    ctx.restore();
    // 이름표
    ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
    const tw = ctx.measureText('김하늘').width + 16;
    ctx.fillStyle = 'rgba(15,23,42,.8)'; ctx.fillRect(p.x - tw / 2, top - 26, tw, 26);
    ctx.fillStyle = '#fff'; ctx.fillText('김하늘', p.x, top - 6);

    const pf = (now / 160 | 0) % 4;
    drawAvatar(pvF, look, false, pf); drawAvatar(pvB, look, true, pf);
    requestAnimationFrame(loop);
  })(last);
});
</script>
</body>
</html>
