<!doctype html>
<!-- Firebase 옛 주소(class-arena-b4ee3.web.app)에 올라가는 안내 페이지. 배포할 때 __GAME_URL__을 새 게임 주소로 바꿔 넣음 (deploy.yml) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>클래스 아레나 주소가 바뀌었어요</title>
<script>
  // 주소 뒤의 ?dev=, ?stu=, #... 같은 값도 그대로 들고 감
  location.replace('__GAME_URL__' + location.pathname + location.search + location.hash);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  a { color: #fbbf24; font-size: 1.2rem; word-break: break-all; }
</style>
</head>
<body>
  <div>
    <p>클래스 아레나 주소가 바뀌었어요. 잠시 뒤 새 주소로 넘어가요.</p>
    <p><a href="__GAME_URL__">__GAME_URL__</a></p>
    <p>새 주소를 즐겨찾기에 다시 저장해 주세요.</p>
  </div>
</body>
</html>
