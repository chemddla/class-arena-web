<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Arena 테스트 전장</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020617; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <!-- 주소 /test 로 들어오는 테스트 전장. 게임 엔진은 그대로 쓰고 패널만 test/sandbox.js 가 붙임 (내 컴퓨터 localhost에서만 열림) -->
  <iframe id="sbFrame" src="../index.html?dev=sandbox" title="테스트 전장"></iframe>
  <script>
    // 새로고침 직후엔 키보드 포커스가 바깥 페이지에 있어 WASD가 안 먹으므로, 로드되면 전장 쪽으로 포커스를 넘김
    (function () {
      const f = document.getElementById('sbFrame');
      const give = () => { try { f.focus(); f.contentWindow.focus(); } catch (e) {} };
      f.addEventListener('load', () => { give(); setTimeout(give, 300); setTimeout(give, 1000); });
      window.addEventListener('focus', give);
    })();

    // 최신 main 테스트 서버(tools/live-main-server.cjs)로 열었을 때만: 지금 보는 커밋을 표시하고,
    // 누가 origin/main에 새로 푸시하면 "새 버전 도착" 버튼을 띄움 (누르면 전장을 새 코드로 다시 불러옴)
    (function () {
      let shown = '';
      const badge = document.createElement('button');
      badge.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:9;border:0;border-radius:6px;padding:4px 8px;' +
        'font:12px/1.4 system-ui,sans-serif;color:#cbd5e1;background:rgba(15,23,42,.85);cursor:default;max-width:60vw;' +
        'white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
      badge.addEventListener('click', () => { if (badge.dataset.fresh) location.reload(); });
      async function check() {
        let v;
        try { const r = await fetch('/__live/version', { cache: 'no-store' }); if (!r.ok) return false; v = await r.json(); }
        catch (e) { return false; }
        if (!v.commit) return true;
        if (!badge.isConnected) document.body.appendChild(badge);
        if (!shown) {
          shown = v.commit;
          badge.textContent = '최신 main ' + v.short + ' · ' + v.subject;
          badge.title = '이 화면은 origin/main을 몇 초마다 받아 옴';
        } else if (v.commit !== shown) {
          badge.dataset.fresh = '1';
          badge.style.background = '#16a34a';
          badge.style.color = '#fff';
          badge.style.cursor = 'pointer';
          badge.textContent = '새 버전 도착 ' + v.short + ' · ' + v.subject + ' — 눌러서 새로고침';
        }
        return true;
      }
      check().then((ok) => { if (ok) setInterval(check, 3000); });
    })();
  </script>
</body>
</html>
