<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Arena 테스트 전장</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020617; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <!-- 주소 /test 로 들어오는 테스트 전장. 게임 엔진은 그대로 쓰고 패널만 test/sandbox.js 가 붙임 (내 컴퓨터 localhost에서만 열림) -->
  <iframe id="sbFrame" src="../index.html?dev=sandbox" title="테스트 전장"></iframe>
  <script>
    // 새로고침 직후엔 키보드 포커스가 바깥 페이지에 있어 WASD가 안 먹으므로, 로드되면 전장 쪽으로 포커스를 넘김
    (function () {
      const f = document.getElementById('sbFrame');
      const give = () => { try { f.focus(); f.contentWindow.focus(); } catch (e) {} };
      f.addEventListener('load', () => { give(); setTimeout(give, 300); setTimeout(give, 1000); });
      window.addEventListener('focus', give);
    })();
  </script>
</body>
</html>
